name: Publish Skill to ClawHub

on:
  push:
    branches: [main]
    paths:
      - 'skill/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Authenticate
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: bunx clawhub@latest login --token "$CLAWHUB_TOKEN" --no-browser

      - name: Determine version
        id: version
        run: |
          # Use npm package version as skill version
          VERSION=$(bun -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish to ClawHub
        run: |
          bunx clawhub@latest publish ./skill/ \
            --slug zalo-agent \
            --name "Zalo Agent CLI" \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "Auto-publish from commit ${{ github.sha }}"
