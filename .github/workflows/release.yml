name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Check the release tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(bun -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version 'v$version'"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint --format github
      - run: bun run format:check
      - run: bun test

  binaries:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build standalone binaries
        run: |
          build() {
            target="$1"; suffix="$2"
            bun build ./src/index.ts --compile --minify --target="bun-$target" --outfile "dist/zalo-agent-$suffix"
          }
          build linux-x64 linux-x64
          build linux-arm64 linux-arm64
          build darwin-x64 darwin-x64
          build darwin-arm64 darwin-arm64
          build windows-x64 windows-x64.exe
      - name: Smoke-test the linux-x64 binary
        run: ./dist/zalo-agent-linux-x64 --version
      - name: Write checksums
        working-directory: dist
        run: sha256sum zalo-agent-* > SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # `bun publish` cannot produce npm provenance attestations, so this step uses npm.
      # The package ships TypeScript sources, so nothing is built here and the checks already ran in `verify`.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
